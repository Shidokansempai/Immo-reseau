<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:Montserrat,sans-serif;
 background:linear-gradient(180deg,#0e2a47 0%,#1f4e79 28%,#e9865a 62%,#f6c177 80%,#fbe3b4 100%);position:relative;color:#fff}
.sun{position:absolute;left:50%;top:1010px;width:420px;height:420px;margin-left:-210px;border-radius:50%;
 background:radial-gradient(circle,#fff6d8 0%,#ffd27a 45%,rgba(255,180,90,0) 72%)}
svg.mount{position:absolute;left:0;bottom:0;width:1080px;height:760px}
.logo{position:absolute;top:290px;left:50%;transform:translateX(-50%);text-align:center;filter:drop-shadow(0 6px 24px rgba(0,0,0,.35))}
.logo img{width:640px;display:block;margin:auto}
.logo:after{content:"";display:block;width:140px;height:8px;border-radius:4px;background:#9AC21F;margin:36px auto 0}
.wm{font-weight:800;font-size:76px;letter-spacing:2px;color:#1f4e79;line-height:1}
.wm span{color:#e9865a}
.wm-sub{font-size:22px;letter-spacing:8px;color:#5b6b7c;margin-top:12px;font-weight:600}
.msg{position:absolute;top:640px;width:100%;text-align:center;padding:0 80px}
.msg h1{font-family:'Playfair Display',serif;font-size:132px;line-height:1.02;text-shadow:0 6px 30px rgba(0,0,0,.25)}
.msg h1 em{font-style:italic;font-weight:600;color:#ffd99a}
.msg p{margin-top:36px;font-size:40px;font-weight:600;line-height:1.35}
.sign{position:absolute;bottom:330px;width:100%;text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.sign .l1{font-size:30px;font-weight:800;letter-spacing:6px}
.sign .l2{font-size:26px;margin-top:10px;font-weight:600}
</style></head><body>
<div class="sun"></div>
<svg class="mount" viewBox="0 0 1080 760" preserveAspectRatio="none">
 <path d="M0 430 L180 300 L300 360 L470 170 L560 250 L640 200 L800 330 L920 280 L1080 360 L1080 760 L0 760Z" fill="#2c5f5a" opacity=".85"/>
 <path d="M0 520 L150 450 L320 500 L520 400 L700 480 L880 430 L1080 490 L1080 760 L0 760Z" fill="#1d4a44"/>
 <path d="M0 610 Q270 570 540 600 T1080 595 L1080 760 L0 760Z" fill="#fbe3b4"/>
</svg>
<div class="logo">LOGO_SLOT</div>
<div class="msg">
 <h1>Bonne<br><em>journée</em></h1>
 <p>à toute la communauté ☀️<br>Belle journée sur notre île 🌴</p>
</div>
<div class="sign"><div class="l1">IMMO RÉSEAU · LA RÉUNION</div><div class="l2">Jules — votre conseiller immobilier</div></div>
</body></html>
