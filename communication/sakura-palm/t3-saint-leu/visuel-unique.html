<style>

* { box-sizing:border-box; margin:0; }
body { background:#ddd; }

.side { position:absolute; z-index:4; }
.tag { font:600 21px var(--caps); letter-spacing:.32em; color:var(--gold-d); text-transform:uppercase; text-align:center; }
.title { font:600 76px/1 var(--serif); text-align:center; margin-top:14px; }
.sub { font:italic 500 33px/1.25 var(--serif); color:var(--rose); text-align:center; margin-top:12px; }
.count { position:absolute; left:66px; bottom:58px; font:500 18px var(--caps); letter-spacing:.2em; color:var(--gold-d); z-index:4; }
.foot { position:absolute; left:0; right:0; bottom:58px; text-align:center; font:500 16px var(--caps); letter-spacing:.3em; color:var(--gold-d); text-transform:uppercase; z-index:4; }
.medal { position:absolute; left:50%; transform:translateX(-50%); border-radius:50%; z-index:7; box-shadow:0 10px 30px rgba(44,58,30,.28), 0 0 0 6px var(--cream); }
.rule { display:flex; align-items:center; justify-content:center; gap:22px; color:var(--gold-d); font-size:24px; }
.rule::before, .rule::after { content:""; width:110px; height:1.5px; background:var(--gold); }

.qr .qr-svg { display:block; width:100%; height:auto; }
.qr p { font:600 18px var(--caps); letter-spacing:.24em; color:var(--palm); margin-top:10px; text-transform:uppercase; }
.qr small { display:block; font:400 15px var(--sans); color:var(--gold-d); margin-top:4px; }
.mosaic { position:absolute; left:62px; right:62px; top:330px; height:800px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:14px; z-index:3; }
.cell { background-size:cover; border:5px solid #fffdf8; box-shadow:0 6px 16px rgba(44,58,30,.16); }
.cell.logo { display:grid; place-items:center; background:var(--cream); }
.cell.logo img { width:88%; border-radius:50%; box-shadow:0 6px 18px rgba(44,58,30,.22); }
